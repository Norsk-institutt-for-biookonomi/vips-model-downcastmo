name=L\u00f8kbladskimmel &ndash; DeVissers Downcast
description=<p>Modellen beregner om det er fare for infeksjon av l&oslash;kbladskimmel (<em>Peronospora destructor</em>) i v&aring;rl&oslash;k, kepal&oslash;k og andre arter innen <em>Allium sp</em>. Varslene er basert p&aring; v&aelig;rdata og v&aelig;rprognoser.</p> <p>L&oslash;kbladskimmel opptrer hovedsakelig p&aring; sensommeren selv om tidlige angrep kan forekomme, og er ikke &aring;rviss i alle omr&aring;der med l&oslash;kproduksjon. Det er derfor viktig &aring; vurdere om det er reell fare for smitte, selv om det g&aring;r ut varsler om fare for infeksjon.</p> <p>{{filename="/images/lokbladskimmel.jpg" description="L&oslash;kbladskimmel i v&aring;rl&oslash;k. (Foto: Arne Hermansen, NIBIO)"}}<br /><em>L&oslash;kbladskimmel i v&aring;rl&oslash;k. (Foto: Arne Hermansen, NIBIO)</em></p> <p>Varslingsmodellen DeVissers Downcast er basert p&aring; l&oslash;kbladskimmelens biologi og respons p&aring; ulike v&aelig;rforhold. Varsler beregnes med utgangspunkt i timeverdier for luftfuktighet, lufttemperatur, bladfuktighet og nedb&oslash;r. V&aelig;rdata hentes fra v&aelig;rstasjoner tilknyttet <a href="https://lmt.nibio.no/" target="_blank" rel="noopener">Landbruksmeteorologisk Tjeneste (LMT)</a> og 2-d&oslash;gns v&aelig;rprognoser fra <a href="https://met.no" target="_blank" rel="noopener">Meteorologisk Institutt</a>.</p> <p>Modellen beregner om det er forhold for sporulering, infeksjon og eventuelt mislykket infeksjon. Varsel om <strong>sporulering</strong> beregnes ved h&oslash;y luftfuktighet om natta (over 92 %), uten nedb&oslash;r. N&aring;r dette skjer gis det et gult varsel om risiko for sporulering. Sporuleringsverdi (1-3) oppgis som en beregning p&aring; hvor gode forholdene har v&aelig;rt, hvor 3 indikerer optimale forhold. Sporulering kan forekomme ved temperaturer fra 4 til 26 &deg;C (optimalt 12-20 &deg;C). Nedb&oslash;r vil hindre sporulering, og det beregnes ikke varsel hvis det er registrert nedb&oslash;r mellom kl 00.00 og 06.00. H&oslash;ye temperaturer vil ogs&aring; p&aring;virke sporulering, og det beregnes ikke sporulering dersom temperaturen foreg&aring;ende dag var over 27 &deg;C.</p> <p><strong>Infeksjon</strong> kan forekomme i inntil 3 d&oslash;gn etter sporulering og gir r&oslash;dt varsel. En direkte infeksjon krever minst 2 timer med bladfukt morgenen etter sporulering. Dersom dette ikke inntreffer kreves det minimum 144 minutter med bladfuktighet i l&oslash;pet av en tretimers-periode innen 72 timer etter sporulering. Det antas at alle sporene spirer samtidig, og det beregnes kun ett infeksjonsvarsel (r&oslash;dt varsel) per sporuleringsvarsel.</p> <p>Mislykket infeksjon beregnes dersom det er en periode med kortvarig bladfuktighet (90-150 minutter i l&oslash;pet av en 5 timers periode) hvor sporene spirer og d&oslash;r f&oslash;r infeksjon skjer.</p> <h3>Tolking av varsel</h3> <ul> <li>Gult varsel viser at det har v&aelig;rt v&aelig;rforhold som kan gi sporulering.</li> <li>R&oslash;dt varsel viser at det er beregnet fare for infeksjon innen 3 d&oslash;gn etter at sporulering har skjedd.</li> </ul> <p>Modellberegninger oppdateres daglig og viser varsler basert p&aring; registrerte v&aelig;rdata frem til dagens dato og 2-d&oslash;gns v&aelig;rprognoser.</p> <p>Forklaring av varseldetaljer:</p> <ul> <li><em>Sporuleringsverdi (Sporulation_value)</em> gir verdier fra 0-3, hvor 3 indikerer optimale forhold for sporulering. Verdi 1-3 gir gult varsel.</li> <li><em>Infeksjon direkte etter sporulering (IDAS)</em> viser om det er beregnet infeksjon morgenen etter sporulering. Verdi 1 gir r&oslash;dt varsel.</li> <li><em>Infeksjon forsinket etter sporulering (ILAS)</em> viser om det er beregnet infeksjon innen 3 d&oslash;gn etter sporulering (Hvis IDAS = 0). Verdi 1 gir r&oslash;dt varsel.</li> <li><em>Infeksjonstidspunkt (ITAS)</em> oppgir beregnet infeksjonstidspunkt ved forsinket infeksjon.</li> </ul> <p>{{filename="/images/chart_DOWNCASTMO.png" description="Skjermdump fra detaljert varselvisning for l&oslash;kbladskimmelvarsel."}}<br /><em>Skjermdump fra detaljert varselvisning for l&oslash;kbladskimmelvarsel.</em></p> <h3>Varslingssesong &ndash; oppstart og avslutning av varsel</h3> <p>Modellen er knyttet til en rekke v&aelig;rstasjoner i omr&aring;der med l&oslash;kproduksjon. Varslene startes 1. juni og avsluttes 30. september. Ta kontakt med VIPS (vips@nibio.no) ved &oslash;nske om at modellen skal settes opp for flere v&aelig;rstasjoner, eller ved behov for justert driftsperiode i sesong.</p> <p>Varsler vises automatisk i kartfunksjonen i VIPS-forsida for alle v&aelig;rstasjoner hvor modellen er startet. Modellen kan ogs&aring; settes opp som et <a href="https://www.vips-landbruk.no/information/35/" target="_blank" rel="noopener">privat varsel</a> med egendefinert start og sluttdato. Dette kan gj&oslash;res for private v&aelig;rstasjoner og for v&aelig;rstasjoner som allerede finnes i LMT-databasen. Se <a href="https://www.vips-landbruk.no/information/27/" target="_blank" rel="noopener">brukerveiledning</a></p> <h3>Utpr&oslash;ving og validering av modellen</h3> <p>DeVissers DOWNCAST er en modell som tar utgangspunkt i den amerikanske modellen DOWNCAST, publisert av Jesperson og Sutton (1987). Modellen ble videreutviklet og testet under nederlandske forhold av DeVisser (1998). Modellen er implementert som beskrevet av DeVisser i 1998.</p> <p>I Norge er modellen validert i feltfors&oslash;k over fem sesonger (2005-2009), som del av prosjektet <em>Sikker og milj&oslash;vennlig bekjempelse av bladskimmel i l&oslash;k, salat og agurk i Norge</em>. Fors&oslash;kene ble gjennomf&oslash;rt i felt med v&aring;rl&oslash;k i Vestfold, hvor modellen ble vurdert i forhold til sporefangst og ulike spr&oslash;yteintervall. Resultatene viste god sammenheng mellom beregnet sporuleringsperiode (gule varsler) og fangst i sporefeller (85% korrekte varsler). Spr&oslash;yteintervall etter varsel ble vurdert slik: dersom det har g&aring;tt mer enn 7 dager etter siste behandling sjekkes VIPS daglig, og spr&oslash;yting avventes til det g&aring;r ut nytt varsel. Spr&oslash;yting etter varsel om infeksjonsrisiko ga like god effekt som ved 7 dagers rutinebehandling, med halvparten s&aring; mange behandlinger.</p> <h3>Anbefaling om bruk av modellen</h3> <p>Ved varsel om fare for infeksjon av l&oslash;kbladskimmel b&oslash;r spr&oslash;yting vurderes ut fra smittepress og tidspunkt for forrige behandling. Ta kontakt med lokal r&aring;dgiver i NLR for vurdering av spr&oslash;ytebehov og aktuelle spr&oslash;yteintervaller.</p> <h3>Referanser</h3> <p>de Visser, C.L.M. 1998. Development of a downy mildew advisory model based on downcast. European Journal of Plant Pathology 104: 933-943.</p> <p>Mer om l&oslash;kbladskimmel finner du i <a href="https://www.plantevernleksikonet.no/l/oppslag/488/" target="_blank" rel="noopener">Plantevernleksikonet</a>.</p> <p>Kontaktperson: <a href="https://nibio.no/ansatte/berit-nordskog" target="_blank" rel="noopener">Berit Nordskog</a></p>
statusInterpretation=<p>R&oslash;dt &ndash; fare for&nbsp;angrep&nbsp;&nbsp;<br />Gult&nbsp;&ndash;&nbsp;mulig fare for angrep&nbsp;<br />Gr&oslash;nt &ndash; ingen fare for angrep&nbsp;&nbsp;<br />Gr&aring;tt &ndash; varsel beregnes ikke/modellen ikke er i drift&nbsp;</p> <p>Gult varsel viser at det har v&aelig;rt v&aelig;rforhold som kan gi&nbsp;sporulering.&nbsp;&nbsp;</p> <p>R&oslash;dt varsel viser at det er beregnet fare for infeksjon&nbsp;innen 3 d&oslash;gn etter at&nbsp;sporulering&nbsp;har skjedd.&nbsp;&nbsp;</p> <h3>Forklaring av varseldetaljer</h3> <p><em>Sporuleringsverdi&nbsp;(Sporulation_value)</em>&nbsp;gir verdier&nbsp;fra&nbsp;0-3, hvor 3 indikerer&nbsp;optimale&nbsp;forhold for&nbsp;sporulering.&nbsp;Verdi 1-3 gir gult varsel.&nbsp;&nbsp;</p> <p><em>Infeksjon direkte etter&nbsp;sporulering&nbsp;(IDAS)&nbsp;</em>viser&nbsp;om det er beregnet infeksjon morgenen etter&nbsp;&nbsp;sporulering. Verdi 1 gir r&oslash;dt varsel.&nbsp;</p> <p><em>Infeksjon forsinket etter&nbsp;sporulering&nbsp;(ILAS)&nbsp;</em>viser om det er beregnet infeksjon innen 3 d&oslash;gn etter&nbsp;sporulering&nbsp;(Hvis IDAS = 0). Verdi 1 gir r&oslash;dt varsel.&nbsp;&nbsp;&nbsp;</p> <p><em>Infeksjonstidspunkt (ITAS)</em>&nbsp;oppgir beregnet infeksjonstidspunkt ved forsinket infeksjon.&nbsp;</p>
usage=<h4>Input data</h4>\n<ul>\n<li>timeZone What timezone the calculation is for. See this list of time zones: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones (Column "TZ")</li>\n<li>Weather parameters\n\t<ul>\n\t<li>BTg - Leaf wetnes in grass (ground level) measured in minutes/hour. BT (Leaf wetness at 2m above ground) are also accepted</li>\n\t<li>TM - Mean temperature (deg C)</li>\n\t<li>RR - Rainfall (mm)</li>\n\t<li>UM - Relative humidity (%)</li>\n\t</ul>\n</li>\n</ul>\n\n<p>These must all be hourly values</p>\n\n<h4>Results returned</h4>\n<ul>\n<li>DOWNCASTMO.SPORULATION_VALUE = The sporulation value.&nbsp;A sporulation index ranging from 1-3 is calculated from the duration of high RH and temperature, where 3 indicates optimal conditions for sporulation</li>\n<li>DOWNCASTMO.IDAS = Infection directly after sporulation (true/false)</li>\n<li>DOWNCASTMO.ILAS = Infection later after sporulation (true/false)</li>\n<li>DOWNCASTMO.ITAS = Infection time after sporulation (date and time)</li>\n</ul>\n
