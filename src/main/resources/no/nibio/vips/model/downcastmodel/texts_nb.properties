name=L\u00f8kbladskimmelmodell
description=<p>Varslingsmodellen Downcast er utviklet av de Visser (1998) i Nederland, og beregner om det er fare for linfeksjoner av bladskimme ut fra v&aelig;rdata. Smitte m&aring; imidlertid v&aelig;re tilstede for at infeksjoner virkelig skjer. Kriterier for b&aring;de sporulering og infeksjon m&aring; v&aelig;re oppfylt for at modellen beregner infeksjonsfare (r&oslash;dt varsel).</p>\n<p>Varsel om sporulering beregnes p&aring; grunnlag av h&oslash;y relativ luftfuktighet (RF) om natta (over 92 %). Sporulering kan forekomme ved temperaturer fra 4 til 26 &deg;C (optimalt 12-20 &deg;C). Det gis en sporuleringsverdi fra 1-3 beregnet utfra varighet av h&oslash;y RF og temperatur, hvor 3 indikerer optimale forhold for sporulering. Det gis ikke varsel dersom det er registrert nedb&oslash;r mellom kl 00.00 og 06.00, eller det var h&oslash;y temperatur foreg&aring;ende dag (flere timer med temperatur over 27 &deg;C).</p>\n<p>Varsel om infeksjon baseres p&aring; bladfuktighet. En direkte infeksjon krever minimum to timer bladfuktighet morgenen etter sporulering (optimal temperatur 6-16 &deg;C). Senere infeksjoner kan forekomme opptil 72 timer etter sporulering, og krever minimum 144 minutter bladfuktighet i l&oslash;pet av en 3 timers periode. Det antas at alle sporene spirer samtidig, og det beregnes kun ett infeksjonsvarsel per sporuleringsvarsel.</p>\n<p>Mislykket infeksjon: Kortvarige perioder med bladfuktighet (90-150 minutter i l&oslash;pet av en 5 timers periode) kan medf&oslash;re at sporene spirer og d&oslash;r. I slike tilfeller gis det IKKE varsel. (neste varsel forutsetter nytt sporuleringsvarsel).</p>
