name=DOWNCAST model
description=The prediction model  DOWNCAST was developed by de Visser (1998) in the Netherlands, and calculates whether there is an infection risk of Onion Downy Mildew (Peronospora destructor) from weather data. Inoculum must be present for infections really happening. Criteria for both sporulation and infection must be satisfied for the model to issue an alert for high infection risk.\n\nSporulation activity is calculated on the basis of nightly high relative humidity (RH) (over 92%). Sporulation can occur at temperatures from 4 to 26 \u00b0C (optimum 12-20 \u00b0C). A sporulation index ranging from 1-3 is calculated from the duration of high RH and temperature, where 3 indicates optimal conditions for sporulation. A risk alert will not be issued if there is precipitation between the hours of 0:00 and 06:00, or there was a high temperature the preceding day (several hours at temperatures above 27 \u00b0 C).\n\nInfection alerts are based on leaf wetness. A direct infection requires a minimum of two hours of leaf wetness the morning after sporulation (optimum temperature 6-16 \u00b0 C). Later infections may occur up to 72 hours after sporulation, and requires a minimum of 144 minutes of leaf wetness over a 3 hour period. It is presumed that all spores sprout(????) simultaneously, so only one infection warning is issued per sporulation event.\n\nUnsuccessful infection: Brief periods of leaf wetness (90 to 150 minutes during a 5 hour period) may cause the spores to sprout(????) and die. In such cases a warning is NOT issued. (Next forecast assumes a new sporulation event).
statusInterpretation=TODO
usage=<p>Results returned are:</p>\n<ul>\n<li>DOWNCASTMO.SPORULATION_VALUE = The sporulation value.&nbsp;A sporulation index ranging from 1-3 is calculated from the duration of high RH and temperature, where 3 indicates optimal conditions for sporulation</li>\n<li>DOWNCASTMO.IDAS = Infection directly after sporulation (true/false)</li>\n<li>DOWNCASTMO.ILAS = Infection later after sporulation (true/false)</li>\n<li>DOWNCASTMO.ITAS = Infection time after sporulation (date and time)</li>\n</ul>
