name=Onion Downy Mildew - DeVisser's Downcast
description=<p>This model calculates infection risk of onion downy mildew (<em>Peronospora destructor</em>) using weather data and forecasts. The model is of relevance to spring onion, bulb onion and other species within <em>Allium sp</em>.</p> <p>In Norway, main outbreaks of onion downy mildew usually appear in late summer (July/August), but not annually in all onion-producing regions. A spraying decision should therefore be based on an assessment of present inoculum, in addition to the issued risk alerts.</p> <p></p> <p> {{filename="/images/lokbladskimmel.jpg" description="Onion downy mildew in spring onion (Photo: Arne Hermansen, NIBIO)"}}<br/> <em>Onion downy mildew in spring onion. (Photo: Arne Hermansen, NIBIO)</em></p> <p></p> <p>The DeVisser Downcast forecast model is based on the biology of onion downy mildew and its response to different weather conditions. Risk events are calculated based on hourly values of humidity, air temperature, leaf moisture and precipitation. Weather data is obtained from weather stations affiliated with the Agrometeorological service (<a href="https://lmt.nibio.no/" target="_blank" rel="noopener">Landbruksmeteorologisk Tjeneste (LMT)</a>) and from 2-day forecasts by the <a href="https://met.no" target="_blank" rel="noopener">Norwegian Meteorological Institute</a>.</p> <p>The model calculates whether there are conditions for sporulation, infection and possibly failed infection.</p> <p><strong>Sporulation events</strong> depend on high relative humidity (RH) at night (over 92%), provided no precipitation between 00:00 and 06:00 AM. When this occurs, a yellow risk alert is issued. Sporulation may occur at temperatures between 4 and 26 &deg;C (optimally 12-20 &deg;C). High temperatures will suppress sporulation, and risk alerts are not issued if temperatures the previous day were above 27 &deg;C. A sporulation index of 1-3 is calculated based on the high RH and temperature duration, where an index of 3 indicates optimal sporulation conditions. </p> <p><strong>Infection events</strong> depend on leaf wetness and can occur up to 3 days after sporulation. Such events will trigger a red risk alert. A direct infection requires at least 2 hours of leaf wetness the morning after sporulation (optimum temperature 6-16 &deg;C). Alternatively, a delayed infection may occur up to 72 hours after sporulation, given at least 144 minutes of leaf wetness during a 3-hour period. It is assumed that all spores germinate simultaneously, thus only one infection event (red alert) can occur after a sporulation event.</p> <p>Short periods of leaf wetness (90-150 minutes during a 5-hour period) may cause the spores to germinate and die. Under these circumstances we have a failed infection, and the potential infection event is cancelled. A later infection event requires a new sporulation event.</p> <h2>Interpretation of warnings</h2> <p>A sporulation event triggers a yellow alert (possible infection risk). A sporulation event followed by an infection event within 72 hours triggers a red alert (high infection risk)</p> <p>Model calculations are updated daily, based on observed weather data to present time and 2-day weather forecasts.</p> <p>Explanation of warning details:</p> <ul> <li><em>Sporulation value (Sporulation_value)</em> gives values from 0-3, where 3 indicates optimal conditions for sporulation. Values 1-3 issue a yellow alert.</li> <li><em>Infection directly after sporulation (IDAS)</em> shows whether infection is expected the morning after sporulation. Red alert if IDAS = 1</li> <li><em>Infection delayed after sporulation (ILAS)</em> shows whether infection is calculated within 3 days after sporulation (If IDAS = 0). Red alert if ILAS = 1.</li> <li><em>Time of infection (ITAS)</em> indicates the estimated time of infection in the case of delayed infection.</li> </ul> <p>{{filename="/images/chart_DOWNCASTMO.png" description="Screenshot from detailed alert view for onion downy mildew risk alerts"}}<br/><em>Screenshot from detailed alert view for onion downy mildew risk alerts.</em></p> <h2>Season of model operation</h2> <p>Risk alerts are issued from a number of weather stations in areas with onion production. The model is active from June through September. Please contact VIPS (<a href="mailto:vips@nibio.no">vips@nibio.no</a>) if there&rsquo;s a wish for model calculations at additional weather stations, or a need for adjustments of the operating period.</p> <p>Risk alerts for all activated weather stations are automatically displayed on the VIPSweb front page map. A <a href="https://www.vips-landbruk.no/information/35/" target="_blank" rel="noopener">private setup</a> with individually selected start and stop dates is available by use of private weather stations and weather stations affiliated with the LMT-network. See user guide. </p> <h2>Test and validation of the model</h2> <p>DeVisser&rsquo;s DOWNCAST is a decision support model based on the American model DOWNCAST (Jesperson and Sutton, 1987) with further adaptations to fit Dutch conditions (DeVisser 1998). The model implemented in VIPS is based on the descriptions by DeVisser (1998).</p> <p>In Norway, the model is validated in field trials over five seasons (2005-2009), as part of the project <em>Effective and sustainable control strategies for downy mildews in onions, lettuce and cucumbers in Norway</em>. The trials were performed in spring onion fields in Vestfold County, where spore catch and different spray intervals were assessed to evaluate model performance. The results showed a good correlation between the estimated sporulation periods (yellow alerts) and capture in spore traps (85 % correct alerts). Spray intervals based on model alerts were assessed as follows: if more than 7 days since last treatment, VIPS is checked daily, and spraying is postponed until the next red risk alert is issued. Model-based spray intervals were as effective as 7-day routine treatment with half as many treatments.</p> <h2>Recommendations for model use</h2> <p>When risk alerts are issued, the potential need for treatments should be based on the infection pressure and timing of previous treatments. Contact your local agricultural advisor for details on treatment strategies such as relevant fungicides, spray timing and treatment intervals.</p> <h2>References</h2> <p>de Visser, C.L.M. 1998. Development of a downy mildew advisory model based on downcast. European Journal of Plant Pathology 104: 933-943.</p> <p>Onion downy mildew description: <a href="https://www.plantevernleksikonet.no/l/oppslag/488/" target="_blank" rel="noopener">Plantevernleksikonet</a> (Norwegian only)</p> <p>Contact person: <a href="https://nibio.no/en/employees/berit-nordskog" target="_blank" rel="noopener">Berit Nordskog</a></p> <p></p>
statusInterpretation=<p>Red &ndash; high risk of infection<br />Yellow &ndash; possible risk of infection.<br />Green &ndash; no risk of infection<br />Grey - no calculations available</p> <p>A sporulation event triggers a yellow alert (possible infection risk). A sporulation event followed by an infection event within 72 hours triggers a red alert (high infection risk)</p> <h3>Explanation of warning details:</h3> <p><em>Sporulation value (Sporulation_value)</em> gives values from 0-3, where 3 indicates optimal conditions for sporulation. Values 1-3 issue a yellow alert.</p> <p><em>Infection directly after sporulation (IDAS)</em> shows whether infection is expected the morning after sporulation. Red alert if IDAS = 1</p> <p><em>Infection delayed after sporulation (ILAS)</em> shows whether infection is calculated within 3 days after sporulation (If IDAS = 0). Red alert if ILAS = 1.</p> <p><em>Time of infection (ITAS)</em> indicates the estimated time of infection in the case of delayed infection.</p>
usage=<h4>Input data</h4>\n<ul>\n<li>timeZone What timezone the calculation is for. See this list of time zones: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones (Column "TZ")</li>\n<li>Weather parameters\n\t<ul>\n\t<li>BTg - Leaf wetnes in grass (ground level) measured in minutes/hour. BT (Leaf wetness at 2m above ground) are also accepted</li>\n\t<li>TM - Mean temperature (deg C)</li>\n\t<li>RR - Rainfall (mm)</li>\n\t<li>UM - Relative humidity (%)</li>\n\t</ul>\n</li>\n</ul>\n\n<p>These must all be hourly values</p>\n\n<h4>Results returned</h4>\n<ul>\n<li>DOWNCASTMO.SPORULATION_VALUE = The sporulation value.&nbsp;A sporulation index ranging from 1-3 is calculated from the duration of high RH and temperature, where 3 indicates optimal conditions for sporulation</li>\n<li>DOWNCASTMO.IDAS = Infection directly after sporulation (true/false)</li>\n<li>DOWNCASTMO.ILAS = Infection later after sporulation (true/false)</li>\n<li>DOWNCASTMO.ITAS = Infection time after sporulation (date and time)</li>\n</ul>\n
